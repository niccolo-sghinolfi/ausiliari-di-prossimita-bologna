<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria - Ausiliari di Prossimità Bologna</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/galleria.css">
</head>

<body>

    <nav id="site-navbar"></nav>

    <section class="side-hero">
        <div class="container text-center text-white">
            <h1 class="display-4 fw-bold mb-3">Galleria</h1>
            <p class="lead mb-0">
                Immagini dei servizi sul territorio e dei volontari in attività
            </p>
        </div>
    </section>

    <section class="py-4">
        <div class="container">
            <div class="gallery-filters-box">
                <button id="filtersToggle" class="filters-toggle-btn" type="button" aria-expanded="false"
                    aria-controls="filtersPanel">
                    <span>Filtri galleria</span>
                    <span id="filtersToggleIcon" class="filters-toggle-icon">+</span>
                </button>

                <div id="filtersPanel" class="filters-panel">
                    <div class="row g-3 align-items-end pt-3">
                        <div class="col-md-8 col-lg-6">
                            <label for="typeFilterSelect" class="form-label mb-1">Tipologia</label>
                            <select id="typeFilterSelect" class="form-select">
                                <option value="">Tutte</option>
                            </select>
                        </div>

                        <div class="col-md-4 col-lg-3">
                            <button id="resetFilters" class="btn btn-outline-secondary w-100">Reset filtri</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div id="galleryGrid" class="gallery-grid"></div>
        </div>
    </section>

    <div class="modal fade" id="galleryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content gallery-modal-content">
                <div class="d-flex justify-content-end p-3">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Chiudi"></button>
                </div>

                <div class="gallery-modal-body">
                    <img id="modalImg" class="gallery-modal-img" alt="Immagine galleria">
                    <div class="gallery-modal-caption text-white text-center mt-3 px-3">
                        <h3 id="modalTitle" class="h4 mb-2"></h3>
                        <p id="modalMeta" class="mb-0"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="../js/dati-galleria.js"></script>
    <script defer src="../js/galleria.js"></script>
    <script defer src="../js/common.js"></script>
</body>

</html>
